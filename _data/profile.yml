short_bio_text_justify: false
short_bio: >-
  <p>
    I'm a senior undergraduate in Computer Science at Zhejiang University, where I am part of the Turing Class.
    I develop AI methods for understanding and designing biomolecules.
  </p>
  <p>
    I work with <a href="https://jianglab.bioengineering.princeton.edu/" target="_blank" rel="noopener noreferrer">Prof. Kaiyi Jiang</a>
    at Princeton University and collaborate with
    <a href="https://people.csail.mit.edu/tommi/" target="_blank" rel="noopener noreferrer">Prof. Tommi Jaakkola</a>
    at MIT. I began my research at the
    <a href="https://cadd.drugflow.com/" target="_blank" rel="noopener noreferrer">CADD Lab</a>
    at Zhejiang University, advised by
    <a href="https://scholar.google.com/citations?user=vHW2kqUAAAAJ&amp;hl=en" target="_blank" rel="noopener noreferrer">Prof. Tingjun Hou</a>.
  </p>

research_interests:
- name: AI for Biological Understanding
  description: >-
    How can AI uncover principles governing molecular hidden data structure, interactions, and function? How can we evaluate this understanding in specific tasks and biological contexts?
- name: Programmable Biomolecular Design
  description: >-
    How can we design biomolecules with functions and property combinations beyond natural repertoires while meeting specified biological requirements? How can computational and experimental feedback make this design process adaptive?

personal_note: >-
  Outside research, I play saxophone in the Zhejiang University Orchestra. I previously played point guard
  for CKC College, and I'm a fan of Lionel Messi and Stephen Curry.

