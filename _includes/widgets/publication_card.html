{% assign publications = include.publications %}
<section class="publications-section" aria-labelledby="publications-heading">
    <div class="section-heading">
        <h2 id="publications-heading">{% if include.title %}{{ include.title }}{% else %}Publications{% endif %}</h2>
        <a href="{{ '/publications' | relative_url }}">All publications</a>
    </div>
    {% for item in publications limit:include.limit %}
        {% include widgets/publication_item.html item=item compact=include.compact %}
    {% endfor %}
</section>
