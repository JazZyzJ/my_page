<nav class="site-nav container-lg" aria-label="Main navigation">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.data.profile.navbar_name }}</a>
    <div class="site-nav-links">
        {% for item in site.data.navigation.pages %}
        <a href="{{ item.url | relative_url }}" {% if item.name == page.navbar_title %}aria-current="page"{% endif %}>{{ item.name }}</a>
        {% endfor %}
    </div>
</nav>
